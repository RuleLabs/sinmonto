[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sinmonto"
# Verrouillé — constitution-finale.md §6 : du fon *Sɛ́n mɔto* ("moteur de
# règle"), vérifié sans collision commerciale ou logicielle notable. Ce
# fichier avait un commentaire contradictoire ("jamais formellement
# verrouillé") laissé après la décision — corrigé, 2026-08.
version = "0.1.0rc3"
description = "Moteur de décision événementiel, explicable, en Python pur — zéro dépendance."
requires-python = ">=3.11"
# Verrouillé dès constitution-finale.md §6. Raison concrète, pas théorique :
# @dataclass(slots=True) — utilisé sur tous les objets internes chauds —
# n'existe qu'à partir de Python 3.10. Meta IA a dû patcher le code pour le
# faire tourner sur 3.9 en revue ; ce fichier existe pour que `pip install`
# refuse proprement sur un Python incompatible plutôt que d'échouer de façon
# confuse au premier import.
dependencies = []

[tool.hatch.build.targets.wheel]
packages = ["sinmonto"]
